expose_php = Off

; Sin la E, las variables que inyecta compose (APP_KEY, claves de Twilio y
; OpenRouter) quedan invisibles para env().
variables_order = "EGPCS"

memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 8M
post_max_size = 8M

date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; El código viene horneado en la imagen, pero revalidar cuesta poco a este
; volumen y evita servir código viejo si alguien monta el fuente encima.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
